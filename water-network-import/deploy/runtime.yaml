apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: water-network-import-data
  namespace: platform-core
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: water-network-import-config
  namespace: platform-core
data:
  IMPORT_DATA_DIR: /data
  IMPORT_JWT_ISSUER: https://auth-dev.dichvunuoc.vn/realms/water-platform
  IMPORT_JWT_AUDIENCE: water-platform
  IMPORT_ALLOWED_CLIENTS: water-network-gis-fe
  IMPORT_ALLOW_FLAT_TENANT: "false"
  IMPORT_DESIGN_URL: http://water-network-design-be:8080
  PROJ_NETWORK: "OFF"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-network-import
  namespace: platform-core
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: water-network-import
  template:
    metadata:
      labels:
        app: water-network-import
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import
          image: water-network-import:local
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: water-network-import-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 15
            periodSeconds: 15
          volumeMounts:
            - name: data
              mountPath: /data
            - name: temp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: water-network-import-data
        - name: temp
          emptyDir:
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: water-network-import
  namespace: platform-core
spec:
  selector:
    app: water-network-import
  ports:
    - name: http
      port: 8090
      targetPort: 8090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: water-network-import
  namespace: platform-core
spec:
  podSelector:
    matchLabels:
      app: water-network-import
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: water-network-bff
      ports:
        - protocol: TCP
          port: 8090
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: water-network-design-be
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 443
