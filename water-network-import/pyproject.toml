[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "water-network-import"
version = "0.1.0"
description = "Tenant-scoped CAD intake, provenance, review and Design GIS publication"
requires-python = ">=3.11"
dependencies = ["ezdxf>=1.4,<2", "shapely>=2.1,<3", "pyproj>=3.7,<4", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20", "PyJWT[crypto]>=2.10,<3", "httpx>=0.28,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
wn-import = "wn_import.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
