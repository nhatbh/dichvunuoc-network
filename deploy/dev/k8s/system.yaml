# SYSTEM 3D, full stack, dev cluster (namespace ${NAMESPACE}). Rendered by deploy/dev/deploy.ps1:
# dollar-brace placeholders come from deploy.env; images carry the deploy tag. Postgres, Redis, RabbitMQ
# and Keycloak are the cluster's shared ones (connection details in the secret
# water-network-system, created by the script, never in this file).
apiVersion: v1
kind: ConfigMap
metadata:
  name: water-network-system
  namespace: ${NAMESPACE}
  labels: { app.kubernetes.io/part-of: water-network-system }
data:
  # Staging: real auth and validation, but design-be may keep files on its volume (LocalDisk).
  ASPNETCORE_ENVIRONMENT: Staging
  Jwt__Mode: Authority
  Jwt__Authority: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
  Jwt__Audience: ${JWT_AUDIENCE}
  MassTransit__RabbitMq__Host: ${RABBITMQ_HOST}
  MassTransit__RabbitMq__Port: "${RABBITMQ_PORT}"
  MassTransit__RabbitMq__VirtualHost: ${RABBITMQ_VHOST}
---
# ---------------------------------------------------------------------------------- gis-be
apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-network-gis-be
  namespace: ${NAMESPACE}
  labels: { app: water-network-gis-be, app.kubernetes.io/part-of: water-network-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: water-network-gis-be } }
  template:
    metadata: { labels: { app: water-network-gis-be, app.kubernetes.io/part-of: water-network-system } }
    spec:
      containers:
        - name: api
          image: ${REGISTRY}/water-network-gis-be:${TAG}
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: water-network-system } }]
          env:
            - { name: ConnectionStrings__PostgreSQL, valueFrom: { secretKeyRef: { name: water-network-system, key: GIS_DB } } }
            - { name: ConnectionStrings__Redis, valueFrom: { secretKeyRef: { name: water-network-system, key: REDIS } } }
            - { name: MassTransit__RabbitMq__Username, valueFrom: { secretKeyRef: { name: water-network-system, key: RABBITMQ_USER } } }
            - { name: MassTransit__RabbitMq__Password, valueFrom: { secretKeyRef: { name: water-network-system, key: RABBITMQ_PASSWORD } } }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 8080 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { cpu: "1", memory: 768Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: water-network-gis-be, namespace: ${NAMESPACE}, labels: { app.kubernetes.io/part-of: water-network-system } }
spec:
  selector: { app: water-network-gis-be }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# -------------------------------------------------------------------------------- asset-be
apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-network-asset-be
  namespace: ${NAMESPACE}
  labels: { app: water-network-asset-be, app.kubernetes.io/part-of: water-network-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: water-network-asset-be } }
  template:
    metadata: { labels: { app: water-network-asset-be, app.kubernetes.io/part-of: water-network-system } }
    spec:
      containers:
        - name: api
          image: ${REGISTRY}/water-network-asset-be:${TAG}
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: water-network-system } }]
          env:
            - { name: ConnectionStrings__PostgreSQL, valueFrom: { secretKeyRef: { name: water-network-system, key: ASSET_DB } } }
            - { name: ConnectionStrings__Redis, valueFrom: { secretKeyRef: { name: water-network-system, key: REDIS } } }
            - { name: MassTransit__RabbitMq__Username, valueFrom: { secretKeyRef: { name: water-network-system, key: RABBITMQ_USER } } }
            - { name: MassTransit__RabbitMq__Password, valueFrom: { secretKeyRef: { name: water-network-system, key: RABBITMQ_PASSWORD } } }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 8080 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 160Mi }, limits: { cpu: "1", memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: water-network-asset-be, namespace: ${NAMESPACE}, labels: { app.kubernetes.io/part-of: water-network-system } }
spec:
  selector: { app: water-network-asset-be }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# ------------------------------------------------------------------------------- design-be
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: water-network-design-files, namespace: ${NAMESPACE}, labels: { app.kubernetes.io/part-of: water-network-system } }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-network-design-be
  namespace: ${NAMESPACE}
  labels: { app: water-network-design-be, app.kubernetes.io/part-of: water-network-system }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: water-network-design-be } }
  template:
    metadata: { labels: { app: water-network-design-be, app.kubernetes.io/part-of: water-network-system } }
    spec:
      securityContext: { fsGroup: 1654 }
      containers:
        - name: api
          image: ${REGISTRY}/water-network-design-be:${TAG}
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: water-network-system } }]
          env:
            - { name: ConnectionStrings__PostgreSQL, valueFrom: { secretKeyRef: { name: water-network-system, key: DESIGN_DB } } }
            - { name: ConnectionStrings__Redis, valueFrom: { secretKeyRef: { name: water-network-system, key: REDIS } } }
            - { name: MassTransit__RabbitMq__Username, valueFrom: { secretKeyRef: { name: water-network-system, key: RABBITMQ_USER } } }
            - { name: MassTransit__RabbitMq__Password, valueFrom: { secretKeyRef: { name: water-network-system, key: RABBITMQ_PASSWORD } } }
            - { name: FileStorage__Provider, value: LocalDisk }
            - { name: FileStorage__LocalDisk__RootPath, value: /app/design-files }
            - { name: GisLookup__Provider, value: Http }
            - { name: GisLookup__BaseUrl, value: "http://water-network-gis-be:8080" }
          volumeMounts: [{ name: files, mountPath: /app/design-files }]
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 8080 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 160Mi }, limits: { cpu: "1", memory: 512Mi } }
      volumes: [{ name: files, persistentVolumeClaim: { claimName: water-network-design-files } }]
---
apiVersion: v1
kind: Service
metadata: { name: water-network-design-be, namespace: ${NAMESPACE}, labels: { app.kubernetes.io/part-of: water-network-system } }
spec:
  selector: { app: water-network-design-be }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# ----------------------------------------------------------------------------- topology-rs
apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-network-topology-rs
  namespace: ${NAMESPACE}
  labels: { app: water-network-topology-rs, app.kubernetes.io/part-of: water-network-system }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: water-network-topology-rs } }
  template:
    metadata: { labels: { app: water-network-topology-rs, app.kubernetes.io/part-of: water-network-system } }
    spec:
      containers:
        - name: topology
          image: ${REGISTRY}/water-network-topology-rs:${TAG}
          ports: [{ containerPort: 8080 }, { containerPort: 50051 }]
          env:
            - { name: TOPOLOGY_AMQP_URL, valueFrom: { secretKeyRef: { name: water-network-system, key: TOPOLOGY_AMQP_URL } } }
            - { name: TOPOLOGY_QUEUE, value: water-network-topology-rs }
            - { name: TOPOLOGY_EXCHANGE, value: "WaterPlatform.BuildingBlocks.EventBus.Integration:IntegrationEventEnvelope" }
            # the graph is rebuilt from gis-be's export with the caller's token (decision 0029)
            - { name: TOPOLOGY_GIS_BASE_URL, value: "http://water-network-gis-be:8080" }
            - { name: TOPOLOGY_SNAPSHOT_PATH, value: /app/data/topology-snapshot.json }
            - { name: RUST_LOG, value: info }
          volumeMounts: [{ name: data, mountPath: /app/data }]
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 10 }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: "1", memory: 512Mi } }
      volumes: [{ name: data, emptyDir: { sizeLimit: 256Mi } }]
---
apiVersion: v1
kind: Service
metadata: { name: water-network-topology-rs, namespace: ${NAMESPACE}, labels: { app.kubernetes.io/part-of: water-network-system } }
spec:
  selector: { app: water-network-topology-rs }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: grpc, port: 50051, targetPort: 50051, appProtocol: kubernetes.io/h2c }
---
# ------------------------------------------------------------------------------------- BFF
apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-network-bff
  namespace: ${NAMESPACE}
  labels: { app: water-network-bff, app.kubernetes.io/part-of: water-network-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: water-network-bff } }
  template:
    metadata: { labels: { app: water-network-bff, app.kubernetes.io/part-of: water-network-system } }
    spec:
      containers:
        - name: api
          image: ${REGISTRY}/water-network-bff:${TAG}
          ports: [{ containerPort: 8080 }]
          envFrom: [{ configMapRef: { name: water-network-system } }]
          env:
            - { name: Downstream__Gis__BaseUrl, value: "http://water-network-gis-be:8080" }
            - { name: Downstream__Asset__BaseUrl, value: "http://water-network-asset-be:8080" }
            - { name: Downstream__Design__BaseUrl, value: "http://water-network-design-be:8080" }
            - { name: Downstream__Import__BaseUrl, value: "http://water-network-import:8090" }
            - { name: Downstream__Topology__BaseUrl, value: "http://water-network-topology-rs:50051" }
            - { name: AppEntitlement__BaseUrl, value: "${APP_CATALOG_URL}" }
            - { name: AppEntitlement__AppCode, value: "${APP_CODE}" }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 10, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 8080 }, initialDelaySeconds: 30, periodSeconds: 20 }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { cpu: "1", memory: 512Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: water-network-bff, namespace: ${NAMESPACE}, labels: { app.kubernetes.io/part-of: water-network-system } }
spec:
  selector: { app: water-network-bff }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
# -------------------------------------------------------------------------------- frontend
# nginx serves the SYSTEM 3D bundle and proxies /api/gis/ to the BFF, so the app and its API
# share one origin (no gateway route or CORS change needed).
apiVersion: v1
kind: ConfigMap
metadata:
  name: water-network-gis-3d
  namespace: ${NAMESPACE}
  labels: { app.kubernetes.io/part-of: water-network-system }
data:
  config.json: |
    {
      "apiUrl": "/api/gis",
      "gisDataSource": "canonical",
      "gisViewerMode": "rich",
      "opsSource": "off",
      "appName": "SYSTEM 3D",
      "mapView": { "center": { "lon": ${MAP_LON}, "lat": ${MAP_LAT} }, "zoom": ${MAP_ZOOM} },
      "keycloakUrl": "${KEYCLOAK_URL}",
      "keycloakRealm": "${KEYCLOAK_REALM}",
      "keycloakClientId": "${KEYCLOAK_CLIENT_ID}",
      "menuAppUrl": "${MENU_APP_URL}"
    }
  default.conf: |
    server {
      listen 8080;
      root /usr/share/nginx/html;
      index index.html;
      client_max_body_size 100m;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-mhX4II4vUWTvksHDsl91lXPdcAHK+Q0b8//NtPJfiL0='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' https: wss:; frame-src 'self' ${KEYCLOAK_URL};" always;
      add_header Cache-Control "no-cache" always;
      location /api/gis/ {
        proxy_pass http://water-network-bff:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
      }
      location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
      location = /config.json { alias /etc/water-network/config.json; add_header Cache-Control "no-cache, must-revalidate" always; }
      location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|glb|wasm)$ { expires 1y; add_header Cache-Control "public, immutable"; }
      location / { try_files $uri $uri/ /index.html; }
    }
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-network-gis-3d
  namespace: ${NAMESPACE}
  labels: { app: water-network-gis-3d, app.kubernetes.io/part-of: water-network-system }
spec:
  replicas: 1
  selector: { matchLabels: { app: water-network-gis-3d } }
  template:
    metadata:
      labels: { app: water-network-gis-3d, app.kubernetes.io/part-of: water-network-system }
      annotations: { water-network/config: "${CONFIG_HASH}" }
    spec:
      containers:
        - name: web
          image: ${REGISTRY}/water-network-gis-3d:${TAG}
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
            - { name: conf, mountPath: /etc/water-network/config.json, subPath: config.json }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 10 }
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { cpu: 250m, memory: 128Mi } }
      volumes: [{ name: conf, configMap: { name: water-network-gis-3d } }]
---
apiVersion: v1
kind: Service
metadata: { name: water-network-gis-3d, namespace: ${NAMESPACE}, labels: { app.kubernetes.io/part-of: water-network-system } }
spec:
  selector: { app: water-network-gis-3d }
  ports: [{ name: http, port: 8080, targetPort: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: water-network-gis-3d
  namespace: ${NAMESPACE}
  labels: { app.kubernetes.io/part-of: water-network-system }
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: ${INGRESS_CLASS}
  tls: [{ hosts: ["${FRONTEND_HOST}"], secretName: ${TLS_SECRET} }]
  rules:
    - host: ${FRONTEND_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: water-network-gis-3d, port: { number: 8080 } } }
---
# ------------------------------------------------------------------------- network policies
# The namespace denies traffic by default per app (<app>-default-deny + <app>-allow policies of
# the earlier deployment, which still select these pods by their app label). Policies only add
# allowed paths, so these open what SYSTEM 3D needs on top: the web pods to the BFF, the BFF to
# topology-rs, topology-rs to gis-be and RabbitMQ, and the services to the shared PostgreSQL /
# Redis / RabbitMQ ports and to Keycloak (HTTPS, token keys). DNS for all of them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: water-network-system-web-to-bff, namespace: ${NAMESPACE}, labels: { app.kubernetes.io/part-of: water-network-system } }
spec:
  podSelector: { matchExpressions: [{ key: app, operator: In, values: [water-network-gis, water-network-gis-3d] }] }
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: { matchLabels: { app: water-network-bff } } }]
      ports: [{ protocol: TCP, port: 8080 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: water-network-system-bff-from-web, namespace: ${NAMESPACE}, labels: { app.kubernetes.io/part-of: water-network-system } }
spec:
  podSelector: { matchLabels: { app: water-network-bff } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchExpressions: [{ key: app, operator: In, values: [water-network-gis, water-network-gis-3d] }] } }]
      ports: [{ protocol: TCP, port: 8080 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: water-network-topology-rs } } }]
      ports: [{ protocol: TCP, port: 50051 }]
    - to: [{ podSelector: { matchExpressions: [{ key: app, operator: In, values: [water-network-gis-be, water-network-asset-be, water-network-design-be, water-network-import] }] } }]
      ports: [{ protocol: TCP, port: 8080 }, { protocol: TCP, port: 8090 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: water-network-system-topology, namespace: ${NAMESPACE}, labels: { app.kubernetes.io/part-of: water-network-system } }
spec:
  podSelector: { matchLabels: { app: water-network-topology-rs } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ podSelector: { matchLabels: { app: water-network-bff } } }]
      ports: [{ protocol: TCP, port: 50051 }, { protocol: TCP, port: 8080 }]
  egress:
    - to: [{ podSelector: { matchLabels: { app: water-network-gis-be } } }]
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: water-network-system-gis-from-topology, namespace: ${NAMESPACE}, labels: { app.kubernetes.io/part-of: water-network-system } }
spec:
  podSelector: { matchLabels: { app: water-network-gis-be } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: { matchExpressions: [{ key: app, operator: In, values: [water-network-topology-rs, water-network-bff, water-network-design-be] }] } }]
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: water-network-system-infra-egress, namespace: ${NAMESPACE}, labels: { app.kubernetes.io/part-of: water-network-system } }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/part-of: water-network-system } }
  policyTypes: [Egress]
  egress:
    # the shared PostgreSQL, Redis and RabbitMQ, wherever they run in the cluster
    - to: [{ namespaceSelector: {} }]
      ports: [{ protocol: TCP, port: ${POSTGRES_PORT} }, { protocol: TCP, port: ${REDIS_PORT} }, { protocol: TCP, port: ${RABBITMQ_PORT} }]
    # Keycloak (token signing keys) and other HTTPS endpoints
    - ports: [{ protocol: TCP, port: 443 }]
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
