# SYSTEM 3D on the longvan-dev Docker host (decision 0033): one Compose project "water-network",
# copied to ~/water-network on the server by deploy/longvan/deploy.ps1 together with .env
# (settings from deploy.env + generated secrets, never in git), web/default.conf and
# web/config.json. Everything stays on the project's own network; only the web container also
# joins nginx-proxy-manager's network, which serves https://${FRONTEND_HOST} to it. No host ports.
name: water-network

x-dotnet: &dotnet
  restart: unless-stopped
  networks: [internal]
  environment: &dotnet-env
    ASPNETCORE_ENVIRONMENT: Staging
    Jwt__Mode: Authority
    Jwt__Authority: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
    Jwt__Audience: ${JWT_AUDIENCE}
    ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD},abortConnect=false
    MassTransit__RabbitMq__Host: rabbitmq
    MassTransit__RabbitMq__Port: "5672"
    MassTransit__RabbitMq__VirtualHost: /
    MassTransit__RabbitMq__Username: water
    MassTransit__RabbitMq__Password: ${RABBITMQ_PASSWORD}
  logging: &logging
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

x-migrate: &migrate
  restart: "no"
  networks: [internal]
  command: ["--migrate"]
  logging: *logging
  depends_on:
    postgres: { condition: service_healthy }

services:
  # ------------------------------------------------------------------------ shared services
  postgres:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: water
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: water
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U water -d water"]
      interval: 5s
      retries: 30
    logging: *logging

  redis:
    image: redis:7.4.11-alpine
    restart: unless-stopped
    networks: [internal]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes: [redis:/data]
    # redis-cli takes the password from REDISCLI_AUTH
    environment: { REDISCLI_AUTH: "${REDIS_PASSWORD}" }
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 30
    logging: *logging

  rabbitmq:
    image: rabbitmq:3.13-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      RABBITMQ_DEFAULT_USER: water
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes: [rabbitmq:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 30
    logging: *logging

  # ------------------------------------------------------------- migrations (run, then exit)
  gis-be-migrate:
    <<: *migrate
    image: water-network/water-network-gis-be:${IMAGE_TAG}
    environment:
      <<: *dotnet-env
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Username=water;Password=${POSTGRES_PASSWORD};Database=wn_gis
  asset-be-migrate:
    <<: *migrate
    image: water-network/water-network-asset-be:${IMAGE_TAG}
    environment:
      <<: *dotnet-env
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Username=water;Password=${POSTGRES_PASSWORD};Database=wn_asset
  design-be-migrate:
    <<: *migrate
    image: water-network/water-network-design-be:${IMAGE_TAG}
    environment:
      <<: *dotnet-env
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Username=water;Password=${POSTGRES_PASSWORD};Database=wn_design

  # ------------------------------------------------------------------------------- services
  water-network-gis-be:
    <<: *dotnet
    image: water-network/water-network-gis-be:${IMAGE_TAG}
    environment:
      <<: *dotnet-env
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Username=water;Password=${POSTGRES_PASSWORD};Database=wn_gis
    depends_on:
      gis-be-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  water-network-asset-be:
    <<: *dotnet
    image: water-network/water-network-asset-be:${IMAGE_TAG}
    environment:
      <<: *dotnet-env
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Username=water;Password=${POSTGRES_PASSWORD};Database=wn_asset
    depends_on:
      asset-be-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  water-network-design-be:
    <<: *dotnet
    image: water-network/water-network-design-be:${IMAGE_TAG}
    environment:
      <<: *dotnet-env
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Username=water;Password=${POSTGRES_PASSWORD};Database=wn_design
      FileStorage__Provider: LocalDisk
      FileStorage__LocalDisk__RootPath: /app/design-files
      GisLookup__Provider: Http
      GisLookup__BaseUrl: http://water-network-gis-be:8080
    volumes: [design-files:/app/design-files]
    depends_on:
      design-be-migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  water-network-topology-rs:
    image: water-network/water-network-topology-rs:${IMAGE_TAG}
    restart: unless-stopped
    networks: [internal]
    environment:
      TOPOLOGY_AMQP_URL: amqp://water:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2f
      TOPOLOGY_QUEUE: water-network-topology-rs
      TOPOLOGY_EXCHANGE: "WaterPlatform.BuildingBlocks.EventBus.Integration:IntegrationEventEnvelope"
      TOPOLOGY_GIS_BASE_URL: http://water-network-gis-be:8080
      TOPOLOGY_SNAPSHOT_PATH: /app/data/topology-snapshot.json
      RUST_LOG: info
    volumes: [topology:/app/data]
    depends_on:
      rabbitmq: { condition: service_healthy }
    logging: *logging

  water-network-import:
    image: water-network/water-network-import:${IMAGE_TAG}
    restart: unless-stopped
    networks: [internal]
    read_only: true
    tmpfs: [/tmp]
    environment:
      IMPORT_DATA_DIR: /data
      IMPORT_JWT_ISSUER: ${KEYCLOAK_URL}/realms/${KEYCLOAK_REALM}
      IMPORT_JWT_AUDIENCE: ${JWT_AUDIENCE}
      IMPORT_ALLOWED_CLIENTS: ${KEYCLOAK_CLIENT_ID}
      IMPORT_ALLOW_FLAT_TENANT: "${ALLOW_FLAT_TENANT}"
      IMPORT_DESIGN_URL: http://water-network-design-be:8080
      PROJ_NETWORK: "OFF"
    volumes: [import-data:/data]
    logging: *logging

  water-network-bff:
    <<: *dotnet
    image: water-network/water-network-bff:${IMAGE_TAG}
    environment:
      <<: *dotnet-env
      # the BFF does not use RabbitMQ: no health check against it
      MassTransit__RabbitMq__Host: ""
      Downstream__Gis__BaseUrl: http://water-network-gis-be:8080
      Downstream__Asset__BaseUrl: http://water-network-asset-be:8080
      Downstream__Design__BaseUrl: http://water-network-design-be:8080
      Downstream__Import__BaseUrl: http://water-network-import:8090
      Downstream__Topology__BaseUrl: http://water-network-topology-rs:50051
      AppEntitlement__Enabled: "${APP_ENTITLEMENT_ENABLED}"
      AppEntitlement__BaseUrl: ${APP_CATALOG_URL}
      AppEntitlement__AppCode: ${APP_CODE}
    depends_on:
      water-network-gis-be: { condition: service_started }
      water-network-asset-be: { condition: service_started }
      water-network-design-be: { condition: service_started }
      water-network-import: { condition: service_started }
      water-network-topology-rs: { condition: service_started }

  water-network-web:
    image: water-network/water-network-gis-3d:${IMAGE_TAG}
    restart: unless-stopped
    networks: [internal, proxy]
    volumes:
      - ./web/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/config.json:/etc/water-network/config.json:ro
    depends_on:
      water-network-bff: { condition: service_started }
    logging: *logging

networks:
  internal: {}
  # nginx-proxy-manager's network (found by the deploy script)
  proxy:
    external: true
    name: ${PROXY_NETWORK}

volumes:
  postgres: {}
  redis: {}
  rabbitmq: {}
  design-files: {}
  topology: {}
  import-data: {}
