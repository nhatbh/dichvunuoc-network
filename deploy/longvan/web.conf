# nginx of the web container (rendered by deploy/longvan/deploy.ps1; same as the k8s ConfigMap)
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 100m;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-mhX4II4vUWTvksHDsl91lXPdcAHK+Q0b8//NtPJfiL0='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' https: wss:; frame-src 'self' ${KEYCLOAK_URL};" always;
  add_header Cache-Control "no-cache" always;
  location /api/gis/ {
    proxy_pass http://water-network-bff:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_request_buffering off;
    proxy_read_timeout 120s;
  }
  location = /health { access_log off; default_type application/json; return 200 '{"status":"ok"}'; }
  location = /config.json { alias /etc/water-network/config.json; add_header Cache-Control "no-cache, must-revalidate" always; }
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|glb|wasm)$ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; }
}
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
