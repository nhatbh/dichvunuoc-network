syntax = "proto3";

package waternetwork.topology.v1;

// Read-only topology queries over the per-tenant in-memory network graph.
// Tenant is an explicit field on every request. A caller may forward its bearer token in the
// `authorization` metadata: when the tenant has no graph yet, topology-rs rebuilds it from
// gis-be's export with that token (decision 0029). `graph_ready` is false when it could not.
service TopologyService {
  rpc ValidateTopology(ValidateTopologyRequest) returns (ValidateTopologyResponse);
  rpc TraceNetwork(TraceNetworkRequest) returns (TraceNetworkResponse);
  rpc FindNearestValves(FindNearestValvesRequest) returns (FindNearestValvesResponse);
  rpc ComputeIsolationZone(ComputeIsolationZoneRequest) returns (ComputeIsolationZoneResponse);
}

enum IssueType {
  ISSUE_TYPE_UNSPECIFIED = 0;
  ORPHAN_NODE = 1;
  MISSING_ENDPOINT = 2;
  DISCONNECTED_COMPONENT = 3;
}

message TopologyIssue {
  IssueType type = 1;
  repeated string asset_ids = 2;
}

message ValidateTopologyRequest { string tenant_id = 1; }
message ValidateTopologyResponse {
  repeated TopologyIssue issues = 1;
  uint64 graph_version = 2;
  bool graph_ready = 3;
}

enum TraceDirection {
  TRACE_DIRECTION_ALL = 0;        // depth-limited search in every direction
  TRACE_DIRECTION_UPSTREAM = 1;   // back to the sources (supplies/stores nodes)
  TRACE_DIRECTION_DOWNSTREAM = 2; // what the start feeds
}

message TraceNetworkRequest {
  string tenant_id = 1;
  string start_node_id = 2;
  uint32 max_depth = 3;            // 0 = unbounded for upstream/downstream
  TraceDirection direction = 4;
}
message TraceNetworkResponse {
  repeated string node_ids = 1;
  repeated string pipe_ids = 2;
  uint64 graph_version = 3;
  repeated string source_node_ids = 4; // upstream: the sources reached
  bool graph_ready = 5;
}

message FindNearestValvesRequest {
  string tenant_id = 1;
  string start_node_id = 2;
  uint32 k = 3;
}
message NearestValve {
  string device_id = 1;
  string pipe_id = 2;
  uint32 distance = 3;
}
message FindNearestValvesResponse {
  repeated NearestValve valves = 1;
  uint64 graph_version = 2;
  bool graph_ready = 3;
}

message ComputeIsolationZoneRequest {
  string tenant_id = 1;
  oneof start {
    string start_node_id = 2;
    string start_pipe_id = 3;
  }
}
message ComputeIsolationZoneResponse {
  repeated string valves_to_close = 1;
  repeated string isolated_nodes = 2;
  repeated string isolated_pipes = 3;
  uint64 graph_version = 4;
  repeated string boundary_pipe_ids = 5;
  repeated string affected_service_ids = 6; // devices that serve customers in the zone
  bool graph_ready = 7;
}
