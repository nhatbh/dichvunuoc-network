services:
  app:
    build:
      # Context is water-network-fe/ so the file: workspace packages
      # (@wn/contracts, @wn/map-runtime) are inside the build context.
      context: ../..
      dockerfile: apps/gis/Dockerfile
    ports:
      - "8080:80"
    environment:
      - VITE_API_URL=http://localhost:3001/api
      - VITE_AUTH_MODE=mock

  # Keycloak for SSO development
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    ports:
      - "8090:8080"
    environment:
      KC_DB: dev-file
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
