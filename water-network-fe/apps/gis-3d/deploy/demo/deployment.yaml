apiVersion: apps/v1
kind: Deployment
metadata:
  name: water-network-gis-3d-demo
  labels: { app: water-network-gis-3d-demo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: water-network-gis-3d-demo }
  template:
    metadata:
      labels: { app: water-network-gis-3d-demo }
    spec:
      # the static files are uploaded to this node's disk (hostPath), so the pod must run there
      nodeSelector:
        kubernetes.io/hostname: tino-32
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.3-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 2, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: http }, initialDelaySeconds: 5, periodSeconds: 20 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: site, mountPath: /site, readOnly: true }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
      volumes:
        - name: site
          hostPath:
            path: /srv/water-network/gis-3d-demo
            type: Directory
        - name: nginx-conf
          configMap:
            name: water-network-gis-3d-demo-nginx
