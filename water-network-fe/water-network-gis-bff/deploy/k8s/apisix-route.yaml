# NOTE: The cluster runs APISIX in standalone (configmap) mode, not CRD operator mode.
# This ApisixRoute CRD manifest is authored for future use when the APISIX ingress
# controller / operator is deployed.
#
# For the current cluster, apply the route block in:
#   platform-core/deploy/core/apisix/configmap.yaml → data.apisix.yaml
# (see apisix-configmap-patch.yaml in this directory for the merge-safe patch).
#
# Route summary:
#   Host: gis-dev.dichvunuoc.vn
#   Paths: /api/gis/* and /health
#   Backend: water-network-gis-bff service port 8080
#   JWT validation: Bearer-only via APISIX openid-connect plugin (defence-in-depth;
#                   BFF also validates independently).
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: water-network-gis-bff
  namespace: platform-core
spec:
  http:
    - name: gis-bff-api
      match:
        hosts:
          - gis-dev.dichvunuoc.vn
        paths:
          - /api/gis/*
          - /health
      backends:
        - serviceName: water-network-gis-bff
          servicePort: 8080
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: "https://gis-dev.dichvunuoc.vn,http://localhost:4500"
            allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type,X-Request-Id"
            expose_headers: "X-Request-Id"
            allow_credential: false
            max_age: 3600
        - name: request-id
          enable: true
          config:
            include_in_response: true
